services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: site-sumny:latest
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # http -> https
      - traefik.http.routers.sumny-web.rule=Host(`sumny.tech`)
      - traefik.http.routers.sumny-web.entrypoints=web
      - traefik.http.routers.sumny-web.service=sumny-web
      - traefik.http.routers.sumny-web.middlewares=redirect-to-https@file
      - traefik.http.services.sumny-web.loadbalancer.server.port=80
      # https
      - traefik.http.routers.sumny-websecure.rule=Host(`sumny.tech`)
      - traefik.http.routers.sumny-websecure.entrypoints=websecure
      - traefik.http.routers.sumny-websecure.service=sumny-websecure
      - traefik.http.routers.sumny-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.sumny-websecure.loadbalancer.server.port=80
      # www: redireciona para o apex
      - traefik.http.routers.sumny-www.rule=Host(`www.sumny.tech`)
      - traefik.http.routers.sumny-www.entrypoints=web
      - traefik.http.routers.sumny-www.service=sumny-web
      - traefik.http.routers.sumny-www.middlewares=redirect-to-https@file
      - traefik.http.routers.sumny-wwwsecure.rule=Host(`www.sumny.tech`)
      - traefik.http.routers.sumny-wwwsecure.entrypoints=websecure
      - traefik.http.routers.sumny-wwwsecure.service=sumny-websecure
      - traefik.http.routers.sumny-wwwsecure.middlewares=sumny-www-redirect
      - traefik.http.routers.sumny-wwwsecure.tls.certresolver=letsencrypt
      - traefik.http.middlewares.sumny-www-redirect.redirectregex.regex=^https://www\.sumny\.tech/(.*)
      - traefik.http.middlewares.sumny-www-redirect.redirectregex.replacement=https://sumny.tech/$${1}
      - traefik.http.middlewares.sumny-www-redirect.redirectregex.permanent=true

networks:
  dokploy-network:
    external: true
